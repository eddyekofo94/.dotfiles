name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checkout-portable:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ripgrep tmux   # source-build/verify.sh needs rg and `tmux -V`
      - name: tools unit tests
        run: python3 -m unittest -v tools.tests.session_worktree_test tools.tests.goal_done_test
      - run: sh tools/tests/macos_default_apps_test.sh
      - run: sh tools/tests/transport_security_test.sh
      - run: python3 herdr/tests/test_project_catalog.py -v
      - run: sh herdr/source-build/verify.sh   # skips the binary identity check with no local build
