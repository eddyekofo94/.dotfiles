onboarding = false

[theme]
name = "catppuccin"

[terminal]
default_shell = "/Users/eddyekofo/.dotfiles/herdr/prototype/prototype_shell.sh"
shell_mode = "non_login"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
close_tab = "prefix+shift+x"
workspace_picker = "prefix+w"
goto = "prefix+f"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = ""
close_pane = ""
zoom = "prefix+z"
resize_mode = "prefix+r"
copy_mode = "prefix+s"
toggle_sidebar = "prefix+shift+s"
last_pane = "prefix+tab"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/adaptive_split.sh\""
description = "adaptive split from focused pane shape"

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/swap_pane.sh\" left"
description = "swap focused pane left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/swap_pane.sh\" down"
description = "swap focused pane down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/swap_pane.sh\" up"
description = "swap focused pane up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/swap_pane.sh\" right"
description = "swap focused pane right"

[[keys.command]]
key = "prefix+x"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_close.sh\""
description = "process-aware smart pane close"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/open_visible_url.sh\""
description = "open newest URL visible in focused pane"

[[keys.command]]
key = "prefix+enter"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "prototype scratch shell"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "command -v lazygit >/dev/null 2>&1 && exec lazygit || exec \"${SHELL:-sh}\""
description = "prototype lazygit"
width = "85%"
height = "85%"

[ui]
sidebar_collapsed_mode = "hidden"
pane_borders = true
pane_gaps = false
hide_tab_bar_when_single_tab = true
confirm_close = true
prompt_new_tab_name = false

[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 10000000

[experimental]
kitty_graphics = true
pane_history = false
