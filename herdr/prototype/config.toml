[ui]
sidebar_collapsed_mode = "hidden"
pane_borders = true
pane_gaps = false
hide_tab_bar_when_single_tab = true
confirm_close = true
prompt_new_tab_name = false

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent", "$semantic_state"]]

[ui.toast]
# in-app toasts so destructive-close confirmations ("press again within 5s") and
# other Herdr prompts are visible. Set back to "off" to silence all pop-ups.
delivery = "herdr"

[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 10000000

[experimental]
kitty_graphics = true
pane_history = false
