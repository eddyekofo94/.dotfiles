onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
overlay0 = "#1e1e2e"

[terminal]
default_shell = "/Users/eddyekofo/.dotfiles/herdr/prototype/prototype_shell.sh"
shell_mode = "non_login"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
close_tab = "prefix+shift+x"
workspace_picker = "prefix+w"
goto = "prefix+f"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = ""
close_pane = ""
zoom = "prefix+z"
resize_mode = "prefix+r"
# Prefix+s and Alt+/ enter copy mode; Alt+b enters it with the backward-search
# prompt already open, so a scrollback search is one chord instead of two. The
# search entry point comes from the reviewed source build, so it does nothing
# until herdr/source-build/build.sh --install has run; older binaries ignore the
# key. Copy mode has no CLI or shell entry point, so these must be native
# bindings and cannot go through smart_action.sh: Herdr claims Alt+/ and Alt+b
# globally and Neovim's own <M-/> and <M-b> no longer see them.
copy_mode = ["prefix+s", "alt+/"]
copy_mode_search = "alt+b"
toggle_sidebar = "prefix+shift+s"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
last_pane = ["prefix+tab", "ctrl+^"]

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/adaptive_split.sh\""
description = "adaptive split from focused pane shape"

# Global tmux-style smart navigation. Herdr intercepts Alt+h/j/k/l before any
# app (including non-adapter TUIs like Claude Code, Codex, lazygit); smart_nav.sh
# forwards the chord to nvim/vim/ssh when that is the foreground process,
# otherwise focuses the neighboring Herdr pane. Replicates tmux `bind -n M-h`
# with its vim-only `$fwd` guard so Alt navigation works everywhere.
[[keys.command]]
key = "alt+h"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_nav.sh\" h left"
description = "smart nav left (forward to vim, else focus pane)"

[[keys.command]]
key = "alt+j"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_nav.sh\" j down"
description = "smart nav down (forward to vim, else focus pane)"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_nav.sh\" k up"
description = "smart nav up (forward to vim, else focus pane)"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_nav.sh\" l right"
description = "smart nav right (forward to vim, else focus pane)"

# Global tmux-style Alt actions. Same guard as navigation: forward the chord to
# nvim/vim/ssh when focused (so the editor keeps its own <M-*> maps), otherwise
# perform the Herdr action. Replaces the Fish-prompt-only bindings so these work
# inside any TUI (Claude Code, Codex, lazygit, ...).
[[keys.command]]
key = "alt+v"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_action.sh\" v split-right"
description = "split right (forward to vim, else Herdr split)"

# Alt+n and Alt+s are Herdr-first: they split the *pane*, never the Neovim
# window, so the chord means one thing everywhere. Deliberately not routed
# through smart_action.sh — forwarding them made Neovim's `<C-w>n` / `<C-w>s`
# win inside the editor, which is the one place a Herdr split is most wanted.
# Alt+v still forwards (see above), so an in-editor split stays available.
[[keys.command]]
key = "alt+n"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/shell_action.sh\" split-adaptive"
description = "adaptive Herdr split (never forwarded to vim)"

# Alt+s splits down, freed up by moving the copy-mode search entry to Alt+b.
# Alt+d is deliberately left unbound so it falls through to Neovim and other
# TUIs instead of Herdr claiming it.
[[keys.command]]
key = "alt+s"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/shell_action.sh\" split-down"
description = "split Herdr pane down (never forwarded to vim)"

# Alt+c rather than Alt+q so the chord matches Neovim's own <M-c> "close current
# window". Alt+q is left unbound here, which lets Neovim's <M-q> through
# untouched instead of Herdr intercepting it first.
[[keys.command]]
key = "alt+c"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_action.sh\" c close-pane"
description = "smart close pane (forward to vim, else Herdr close)"

[[keys.command]]
key = "alt+o"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_action.sh\" o close-other-panes"
description = "close sibling panes (forward to vim, else Herdr)"

[[keys.command]]
key = "alt+="
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_action.sh\" = equalize-panes"
description = "equalize panes (forward to vim, else Herdr)"

[[keys.command]]
key = "alt+z"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_action.sh\" z zoom"
description = "toggle zoom (forward to vim, else Herdr)"

[[keys.command]]
key = "alt+shift+x"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_action.sh\" shift+x close-tab"
description = "close tab (forward to vim, else Herdr)"

[[keys.command]]
key = "alt+ctrl+x"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_action.sh\" ctrl+x close-other-tabs"
description = "close other tabs (forward to vim, else Herdr)"

# Wrapped reload: reloads config.toml the way `herdr server reload-config` does,
# after checking the config symlink, that the installed binary is still the
# reviewed build, and that the plugins this config needs are provisioned.
# prefix+shift+c, not the tmux-ish prefix+shift+r: prefix+r is resize_mode and
# prefix+shift+r is the reference picker, and Herdr resolves a duplicate by
# silently disabling the later binding rather than reporting a clash at runtime.
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/../reload.sh\""
description = "reload config with the dotfiles wrapper checks"

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/swap_pane.sh\" left"
description = "swap focused pane left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/swap_pane.sh\" down"
description = "swap focused pane down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/swap_pane.sh\" up"
description = "swap focused pane up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/swap_pane.sh\" right"
description = "swap focused pane right"

[[keys.command]]
key = "prefix+x"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/smart_close.sh\""
description = "process-aware smart pane close"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/close_other_panes.sh\""
description = "confirm close all sibling panes"

[[keys.command]]
key = "prefix+="
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/equalize_panes.sh\""
description = "equalize pane areas without changing topology"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "exec \"$HERDR_PROTOTYPE_DIR/open_visible_url.sh\""
